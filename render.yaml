# Optional Render Blueprint — you can also configure the service manually in the dashboard.
services:
  - type: web
    name: password-reset-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: RESET_TOKEN_EXPIRY_MINUTES
        value: "15"
      # Resend HTTP API — SMTP ports are blocked on Render's free tier
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: "SecureReset <onboarding@resend.dev>"
